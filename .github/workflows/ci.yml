name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'zulu'

jobs:
  # Built inside an Ubuntu 20.04 container rather than on ubuntu-latest: the
  # hosted image is 24.04 with glibc 2.39, which would produce a library that
  # cannot load on the supported floor.
  linux:
    name: linux x64
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: Install build tooling
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
              build-essential cmake git ca-certificates curl unzip

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history so the Opus submodule keeps its tags: its CMake build
          # derives the version via "git describe", and a shallow clone makes it
          # report 0 instead of the real release.
          fetch-depth: 0

      - name: Install JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Build native library
        run: ./gradlew -PCI=true opus-jni-native:build

      - name: Collect binaries
        run: |
          mkdir -p artifacts
          while read -r file; do
            echo "Found binary artifact ${file}"
            cp "${file}" artifacts
          done < ci/binaries

      - name: Verify Ubuntu 20.04 ABI floor
        run: |
          limit=2.31
          status=0
          for lib in artifacts/*.so; do
            echo "=== ${lib} ==="
            objdump -p "${lib}" | awk '/NEEDED/ {print "  needs " $2}'
            highest=$(objdump -T "${lib}" \
                | grep -oE 'GLIBC_[0-9][0-9.]*' \
                | sed 's/GLIBC_//' \
                | sort -V \
                | tail -n1)
            echo "  max GLIBC required: ${highest:-none} (limit ${limit})"
            if [ -n "${highest}" ] \
                && [ "$(printf '%s\n%s\n' "${highest}" "${limit}" | sort -V | tail -n1)" != "${limit}" ]; then
              echo "::error::${lib} requires glibc ${highest}, above the ${limit} floor"
              status=1
            fi
          done
          exit "${status}"

      - name: Verify codec works
        run: ./gradlew -PnativeBinaryExternalDir=artifacts opus-jni-java:test

      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: artifacts

  windows:
    name: windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      # Provides dumpbin for the checks below.
      - name: Add MSVC tools to PATH
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native library
        run: ./gradlew -PCI=true opus-jni-native:build

      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p artifacts
          while read -r file; do
            echo "Found binary artifact ${file}"
            cp "${file}" artifacts
          done < ci/binaries

      - name: Verify Windows 10 floor and static CRT
        shell: pwsh
        run: |
          $status = 0
          foreach ($lib in (Get-ChildItem artifacts -Filter *.dll)) {
            Write-Host "=== $($lib.Name) ==="

            $headers = & dumpbin /headers $lib.FullName

            $machineLine = $headers | Select-String 'machine \(' | Select-Object -First 1
            Write-Host "  $($machineLine.ToString().Trim())"

            $dlls = & dumpbin /imports $lib.FullName |
                Select-String -Pattern '^\s{4}(\S+\.dll)$' |
                ForEach-Object { $_.Matches[0].Groups[1].Value } |
                Sort-Object -Unique
            foreach ($d in $dlls) { Write-Host "  imports $d" }

            # The CRT is linked statically, so requiring the redistributable
            # would mean the runtime setting silently regressed.
            $redist = $dlls | Where-Object { $_ -match '^(VCRUNTIME|MSVCP|MSVCR)' }
            if ($redist) {
              Write-Host "::error::$($lib.Name) needs the VC++ redistributable ($($redist -join ', '))"
              $status = 1
            }

            $osLine = $headers | Select-String 'operating system version' | Select-Object -First 1
            $osVersion = [version](($osLine.ToString().Trim() -split '\s+')[0])
            Write-Host "  PE OS version $osVersion (limit 10.0)"
            if ($osVersion -gt [version]'10.0') {
              Write-Host "::error::$($lib.Name) requires Windows $osVersion"
              $status = 1
            }
          }
          exit $status

      - name: Verify codec works
        run: ./gradlew -PnativeBinaryExternalDir=artifacts opus-jni-java:test

      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-x64
          path: artifacts

  macos:
    name: macos ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 was retired in December 2025; macos-15-intel is the last
          # x86_64 image and is scheduled to go away in August 2027.
          - { runner: macos-15-intel, arch: x86_64, suffix: x64 }
          - { runner: macos-15, arch: arm64, suffix: arm64 }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Build native library
        run: ./gradlew -PCI=true opus-jni-native:build -Parch=${{ matrix.arch }}

      - name: Collect binaries
        run: |
          mkdir -p artifacts
          while read -r file; do
            echo "Found binary artifact ${file}"
            cp "${file}" artifacts
          done < ci/binaries

      - name: Verify macOS 12.7 deployment floor
        run: |
          limit=12.0
          status=0
          for lib in artifacts/*.dylib; do
            echo "=== ${lib} ==="
            otool -L "${lib}" | tail -n +2 | awk '{print "  links " $1}'
            lipo -archs "${lib}" | awk '{print "  architectures: " $0}'
            minos=$(vtool -show-build-version "${lib}" | awk '/minos/ {print $2}')
            echo "  minos: ${minos:-none} (limit ${limit})"
            if [ -z "${minos}" ]; then
              echo "::error::${lib} has no minimum OS version recorded"
              status=1
            elif [ "$(printf '%s\n%s\n' "${minos}" "${limit}" | sort -V | tail -n1)" != "${limit}" ]; then
              echo "::error::${lib} requires macOS ${minos}, above the ${limit} floor"
              status=1
            fi
          done
          exit "${status}"

      - name: Verify codec works
        run: ./gradlew -PnativeBinaryExternalDir=artifacts opus-jni-java:test

      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-${{ matrix.suffix }}
          path: artifacts

  # Packages every platform's binary into the single jar that consumers resolve
  # as com.grill.opuscodec:opus-jni-java.
  jar:
    name: jar
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download every native binary
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: native-binaries

      - name: List collected binaries
        run: ls -l native-binaries

      - name: Build jar
        run: ./gradlew -PnativeBinaryExternalDir=native-binaries opus-jni-java:build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: opus-jni-java
          path: opus-jni-java/build/libs/
