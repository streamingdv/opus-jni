import org.apache.tools.ant.taskdefs.condition.Os

// CMake is invoked directly rather than through the previously bundled
// gradle-cmake.jar plugin, which Gradle 9 rejects outright: its @TaskAction sits
// on a private method, so the task type fails validation and cannot be created.
//
// Driving CMake here also means the build command can pass --config. The plugin
// never did, so multi-config generators such as Visual Studio fell back to Debug
// and shipped an unoptimised library.

def cmakeExecutable = (project.findProperty('cmakeExecutable') ?: 'cmake').toString()
def generationDirectory = layout.buildDirectory.dir('cmake-gen').get().asFile
def nativeBinariesDir = rootProject.ext.nativeBinariesDir
def generatedHeadersDir = rootProject.ext.generatedHeadersDir
def is32bit = rootProject.ext.is32bit

def isWindows = Os.isFamily(Os.FAMILY_WINDOWS)
def isMac = Os.isFamily(Os.FAMILY_MAC)

if (is32bit && !isWindows) {
    throw new GradleException('Only windows supports 32bit currently')
}

def configureArguments = [
        '-S', projectDir.absolutePath,
        '-B', generationDirectory.absolutePath,
        "-DCMAKE_BUILD_TYPE=Release",
        "-DGENERATED_JNI_HEADERS_DIR=${generatedHeadersDir.absolutePath}".toString()
]

// Multi-config generators append the configuration name to the plain output
// directories, so the per-configuration variants are set as well to keep the
// artefact path identical on every platform.
['RUNTIME', 'LIBRARY', 'ARCHIVE'].each { kind ->
    configureArguments += "-DCMAKE_${kind}_OUTPUT_DIRECTORY=${nativeBinariesDir.absolutePath}".toString()
    configureArguments += "-DCMAKE_${kind}_OUTPUT_DIRECTORY_RELEASE=${nativeBinariesDir.absolutePath}".toString()
}

if (isWindows) {
    configureArguments += ['-A', is32bit ? 'Win32' : 'x64', '-T', 'host=x64']
} else if (isMac && project.hasProperty('arch')) {
    configureArguments += "-DCMAKE_OSX_ARCHITECTURES=${project.property('arch')}".toString()
}

def cmakeConfigure = tasks.register('cmakeConfigure', Exec) {
    description = 'Generates the CMake build system for the native library.'
    executable = cmakeExecutable
    args = configureArguments

    inputs.file file('CMakeLists.txt')
    inputs.file file('3rdparty/CMakeLists.txt')
    outputs.dir generationDirectory
}

tasks.register('build', Exec) {
    description = 'Compiles the native opus-jni library.'
    dependsOn cmakeConfigure

    executable = cmakeExecutable
    args '--build', generationDirectory.absolutePath, '--config', 'Release', '--parallel'

    inputs.dir file('src')
    inputs.file file('CMakeLists.txt')
    inputs.dir file('3rdparty/opus/src')
    outputs.dir nativeBinariesDir
}
