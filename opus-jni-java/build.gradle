plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.grill.opuscodec'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    from(rootProject.ext.nativeBinaries) {
        into "native-binaries"
    }
}

compileJava {
    // Generates com_grill_opuscodec_OpusCodec.h for the native build. The
    // toolchain above decides which javac produces it.
    options.compilerArgs += ["-h", rootProject.ext.generatedHeadersDir.absolutePath]
}

test {
    useJUnitPlatform()

    // System.load() is a restricted method: without this, JDK 24+ prints a
    // warning and a future release will refuse the call outright.
    jvmArgs '--enable-native-access=ALL-UNNAMED'

    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
